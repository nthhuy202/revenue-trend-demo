services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: revenue
      POSTGRES_PASSWORD: revenue
      POSTGRES_DB: revenue_trend
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenue -d revenue_trend"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
